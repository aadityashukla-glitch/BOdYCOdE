<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOdYCOdE AI Workout Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
    body { background: linear-gradient(to bottom, #1a1a1a, #0f0f0f); color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { text-align: center; padding: 40px 20px 20px 20px; animation: fadeInDown 1s ease forwards; }
    header h1 { font-size: 3rem; color: #ff3d00; margin-bottom: 10px; }
    header p { font-size: 1.2rem; color: #fff; }

    .gym-animation { width: 300px; height: 300px; margin: 20px auto; position: relative; }
    .dumbbell { width: 60px; height: 20px; background: #ff3d00; border-radius: 10px; position: absolute; top: 140px; left: 120px; animation: lift 2s infinite alternate; }
    .weight-left, .weight-right { width: 20px; height: 60px; background: #ff3d00; position: absolute; top: -20px; border-radius: 4px; }
    .weight-left { left: -20px; }
    .weight-right { right: -20px; }
    @keyframes lift { 0% { transform: rotate(0deg) translateY(0); } 100% { transform: rotate(-15deg) translateY(-30px); } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-50px);} to { opacity: 1; transform: translateY(0);} }

    .chat-container { width: 90%; max-width: 700px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(255,61,0,0.5); display: flex; flex-direction: column; gap: 10px; animation: fadeInUp 1s ease forwards; }
    .chat-messages { height: 300px; overflow-y: auto; padding: 10px; border: 1px solid #ff3d00; border-radius: 10px; background: rgba(0,0,0,0.3); }
    .chat-messages p { margin-bottom: 10px; }
    .chat-input { display: flex; gap: 10px; }
    .chat-input input { flex: 1; padding: 10px; border-radius: 10px; border: none; outline: none; font-size: 1rem; }
    .chat-input button { padding: 10px 20px; border-radius: 10px; border: none; background: #ff3d00; color: #fff; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .chat-input button:hover { background: #ff5722; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px);} to { opacity: 1; transform: translateY(0);} }
  </style>
</head>
<body>

  <header>
    <h1>BOdYCOdE</h1>
    <p>our genes, Reimagined</p>
  </header>

  <div class="gym-animation">
    <div class="dumbbell">
      <div class="weight-left"></div>
      <div class="weight-right"></div>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-messages" id="chat-messages">
      <p><strong>Aaditya:</strong> Hi! i am aaditya I can create personalized workout plans and provide exercise info.</p>
    </div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Ask me about workouts or exercises..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      const chatMessages = document.getElementById('chat-messages');
      chatMessages.innerHTML += `<p><strong>You:</strong> ${message}</p>`;
      input.value = '';

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        chatMessages.innerHTML += `<p><strong>AI:</strong> ${data.reply}</p>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;

      } catch (err) {
        chatMessages.innerHTML += `<p><strong>AI:</strong> Sorry, something went wrong.</p>`;
      }
    }
  </script>

</body>
</html>
