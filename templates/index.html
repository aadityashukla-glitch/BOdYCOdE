<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BodyCode - Cyberpunk Fitness Coach</title>
<style>
:root{
  --primary:#00E5FF;
  --primary-dark:#00B8CC;
  --accent:#6C00FF;
  --success:#00FF88;
  --dark:#000000;
  --secondary:#0A0A0A;
  --light:#FFFFFF;
  --gray-50:#121212;
  --gray-100:#1A1A1A;
  --gray-700:#B0F0FF;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;line-height:1.6;color:var(--light);background:var(--dark);min-height:100vh;transition:background 0.3s,color 0.3s;}
.container{max-width:1200px;margin:0 auto;padding:0 20px;}
header{background:rgba(0,0,0,0.95);padding:16px 0;border-bottom:2px solid var(--primary);position:sticky;top:0;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
nav{display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:32px;font-weight:900;color:var(--primary);text-transform:uppercase;letter-spacing:2px;display:flex;align-items:center;gap:8px;}
.nav-links{display:flex;list-style:none;gap:32px;}
.nav-links a{color:var(--light);text-decoration:none;font-weight:600;transition:all 0.3s;position:relative;}
.nav-links a:hover{color:var(--primary);}
.nav-links a::after{content:'';position:absolute;bottom:-5px;left:0;width:0;height:2px;background:var(--primary);transition:width 0.3s;}
.nav-links a:hover::after{width:100%;}
.btn{padding:12px 28px;border-radius:8px;font-weight:700;cursor:pointer;border:none;transition:all 0.3s;text-decoration:none;display:inline-block;font-size:14px;text-transform:uppercase;letter-spacing:1px;}
.btn-primary{background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);color:var(--dark);box-shadow:0 6px 20px rgba(0,229,255,0.4);}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,229,255,0.6);}
.hero{padding:80px 0;text-align:center;background:linear-gradient(135deg,rgba(0,229,255,0.05) 0%,rgba(108,0,255,0.05) 100%);border-radius:12px;margin:40px 0;animation:fadeIn 1s;}
.hero h1{font-size:56px;font-weight:900;margin-bottom:16px;text-transform:uppercase;letter-spacing:2px;background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{font-size:20px;color:#B0F0FF;max-width:700px;margin:0 auto 40px;}
.hero-tag{display:inline-block;background:rgba(0,229,255,0.2);color:var(--primary);padding:8px 16px;border-radius:20px;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:20px;}
.app-wrapper{display:grid;grid-template-columns:350px 1fr;gap:32px;margin:40px 0;min-height:80vh;}
.sidebar{background:rgba(255,255,255,0.05);padding:32px;border-radius:16px;border:1px solid rgba(0,229,255,0.2);height:fit-content;position:sticky;top:100px;transition:all 0.3s;}
.sidebar-section{margin-bottom:32px;}
.sidebar-title{color:var(--primary);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;display:block;}
.sidebar-item{padding:14px 16px;border-radius:8px;cursor:pointer;margin-bottom:8px;font-weight:600;background:rgba(255,255,255,0.05);border:1px solid transparent;transition:all 0.3s;}
.sidebar-item:hover{background:rgba(0,229,255,0.15);border-color:var(--primary);}
.sidebar-item.active{background:linear-gradient(135deg,rgba(0,229,255,0.3) 0%,rgba(108,0,255,0.2) 100%);border-color:var(--primary);color:var(--primary);}
.main-content{background:rgba(255,255,255,0.03);padding:40px;border-radius:16px;border:1px solid rgba(0,229,255,0.1);}
.section{display:none;animation:fadeIn 0.6s ease-in;}
.section.active{display:block;}
.section h2{font-size:32px;margin-bottom:20px;color:var(--primary);text-transform:uppercase;letter-spacing:1px;}
.section-desc{color:#B0F0FF;font-size:16px;margin-bottom:32px;}
.form-group{margin-bottom:24px;}
label{display:block;margin-bottom:8px;font-weight:700;color:var(--light);font-size:14px;text-transform:uppercase;letter-spacing:0.5px;}
input,select,textarea{width:100%;padding:14px;border:2px solid rgba(0,229,255,0.2);border-radius:8px;font-family:inherit;font-size:14px;background:rgba(255,255,255,0.05);color:var(--light);transition:all 0.3s;}
input::placeholder,textarea::placeholder{color:#707070;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:rgba(0,229,255,0.08);box-shadow:0 0 0 3px rgba(0,229,255,0.2);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.chat-container{display:flex;flex-direction:column;height:600px;border:1px solid rgba(0,229,255,0.2);border-radius:12px;overflow:hidden;background:rgba(255,255,255,0.02);}
.chat-messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;}
.message{display:flex;gap:12px;animation:slideIn 0.3s ease-out;}
.message.user{justify-content:flex-end;}
.message-content{background:rgba(0,229,255,0.2);padding:12px 16px;border-radius:12px;max-width:80%;word-wrap:break-word;transition:all 0.3s;}
.message.user .message-content{background:linear-gradient(135deg,rgba(0,229,255,0.3) 0%,rgba(108,0,255,0.2) 100%);border:1px solid rgba(0,229,255,0.3);}
.message.coach .message-content{background:rgba(0,229,255,0.1);color:#E0E0E0;}
.chat-input{padding:20px;border-top:1px solid rgba(0,229,255,0.2);display:flex;gap:12px;}
.chat-input input{flex:1;margin:0;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,229,255,0.2);}
.chat-input button{background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);color:var(--dark);padding:12px 24px;border-radius:8px;border:none;font-weight:700;cursor:pointer;text-transform:uppercase;font-size:12px;transition:all 0.3s;}
.chat-input button:hover{transform:translateY(-2px);}
.workout-section{background:rgba(255,255,255,0.05);padding:24px;border-radius:12px;border-left:4px solid var(--primary);margin-bottom:20px;animation:fadeIn 0.6s;}
.workout-title{color:var(--primary);font-size:20px;font-weight:900;margin-bottom:16px;text-transform:uppercase;}
.exercise-block{background:rgba(255,255,255,0.03);padding:16px;border-radius:8px;margin-bottom:12px;border-left:3px solid var(--accent);animation:slideIn 0.5s;}
.exercise-name{color:var(--accent);font-weight:700;font-size:16px;margin-bottom:8px;}
.exercise-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;font-size:13px;}
.detail-tag{background:rgba(0,229,255,0.15);padding:8px 12px;border-radius:6px;color:#B0F0FF;border-left:2px solid var(--primary);}
.detail-tag strong{color:var(--primary);}
.loading-spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(0,229,255,0.3);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin:32px 0;}
.stat-card{background:rgba(255,255,255,0.05);padding:24px;border-radius:12px;border:1px solid rgba(0,229,255,0.2);text-align:center;transition:all 0.3s;}
.stat-card:hover{transform:scale(1.05);box-shadow:0 10px 30px rgba(0,229,255,0.4);}
.stat-number{font-size:32px;font-weight:900;color:var(--primary);margin-bottom:8px;}
.stat-label{color:#B0F0FF;font-size:12px;text-transform:uppercase;letter-spacing:1px;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:2000;align-items:center;justify-content:center;}
.modal.active{display:flex;}
.modal-content{background:linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 100%);padding:40px;border-radius:16px;max-width:600px;width:90%;border:2px solid rgba(0,229,255,0.3);box-shadow:0 20px 60px rgba(0,0,0,0.8);}
.modal-close{float:right;font-size:28px;cursor:pointer;color:var(--primary);font-weight:700;}
.modal-close:hover{color:var(--accent);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.app-wrapper{grid-template-columns:1fr}.sidebar{position:static;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.sidebar-section{margin:0}.nav-links{gap:16px;font-size:14px}.form-row{grid-template-columns:1fr}.hero h1{font-size:36px}}
</style>
</head>
